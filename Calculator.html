<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .calculator {
    background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 20px 60px rgba(139, 92, 246, 0.2);
  }

  .display {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    text-align: right;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .display-value {
    font-size: 42px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    word-break: break-all;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 20px;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.05);
  }

  button:active {
    transform: scale(0.95);
  }

  .operator {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.3));
    border-color: rgba(139, 92, 246, 0.5);
  }

  .operator:hover {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), rgba(236, 72, 153, 0.5));
  }

  .equals {
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    border: none;
  }

  .equals:hover {
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
  }

  .clear {
    background: rgba(255, 50, 50, 0.2);
    border-color: rgba(255, 50, 50, 0.4);
  }

  .clear:hover {
    background: rgba(255, 50, 50, 0.4);
  }

  .zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="display-value" id="display">0</div>
  </div>
  
  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button onclick="appendValue('(')">(</button>
    <button onclick="appendValue(')')">)</button>
    <button class="operator" onclick="appendValue('/')">÷</button>
    
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">×</button>
    
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">−</button>
    
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>
    
    <button class="zero" onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let expression = '';
  const display = document.getElementById('display');

  function updateDisplay() {
    display.textContent = expression || '0';
  }

  function appendValue(value) {
    if (expression === '0' && !isNaN(value)) {
      expression = value;
    } else {
      expression += value;
    }
    updateDisplay();
  }

  function clearAll() {
    expression = '';
    updateDisplay();
  }

  function calculate() {
    try {
      if (!expression) return;
      const result = eval(expression);
      expression = String(result);
      updateDisplay();
    } catch (e) {
      expression = 'Ошибка';
      updateDisplay();
      setTimeout(() => {
        expression = '';
        updateDisplay();
      }, 1500);
    }
  }

  // Поддержка клавиатуры
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendValue(e.key);
    else if (e.key === '.') appendValue('.');
    else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendValue(e.key);
    else if (e.key === '(' || e.key === ')') appendValue(e.key);
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clearAll();
  });
</script>

</body>
</html>
